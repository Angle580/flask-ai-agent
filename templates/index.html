<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI Agent Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
header { background: #1f2937; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
header button { background: #374151; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
#chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; width: 100%; margin: 0 auto; }
.msg { margin-bottom: 14px; max-width: 75%; }
.msg.user { margin-left: auto; }
.bubble { padding: 10px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
.msg.user .bubble { background: #4f6ef7; color: #fff; }
.msg.ai .bubble { background: #fff; color: #333; }
.trace { background: #fffbeb; border-left: 3px solid #f59e0b; padding: 8px 12px; margin: 6px 0; font-size: 12px; color: #92400e; border-radius: 4px; font-family: monospace; }
#input-bar { padding: 14px; background: #fff; border-top: 1px solid #eee; }
#input-bar form { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
#input-bar input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
#input-bar button { padding: 10px 20px; background: #4f6ef7; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
.hint { color: #888; font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <b>🤖 AI Agent（工具调用）</b>
  <button onclick="reset()">清空对话</button>
</header>
<div id="chat">
  <div class="msg ai"><div class="bubble">你好，我是一个会用工具的 Agent。试试问我：
  <br>• 现在几点？
  <br>• 帮我算一下 (123+456)*2 等于多少？
  <br>• 帮我记一下：明天下午3点开组会
  <br>• 我都有哪些便签？
  <br>• 北京天气怎么样？</div></div>
</div>
<div id="input-bar">
  <form onsubmit="send(event)">
    <input id="txt" placeholder="输入你的问题..." autocomplete="off">
    <button type="submit">发送</button>
  </form>
  <div class="hint">Powered by 豆bao · 支持 calculator / get_time / notes / weather 五个工具</div>
</div>
<script>
const chat = document.getElementById('chat');
function addMsg(role, text, trace) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let html = '<div class="bubble">' + text.replace(/</g,'&lt;') + '</div>';
  if (trace && trace.length) {
    html = trace.map(t => {
      if (t.type === 'tool_call') return `<div class="trace">🔧 调用工具 ${t.name}(${JSON.stringify(t.args)})</div>`;
      if (t.type === 'tool_result') return `<div class="trace">⬅️ ${t.name} 返回: ${t.result}</div>`;
      return '';
    }).join('') + html;
  }
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
async function send(e) {
  e.preventDefault();
  const txt = document.getElementById('txt');
  const msg = txt.value.trim();
  if (!msg) return;
  addMsg('user', msg);
  txt.value = '';
  const loading = document.createElement('div');
  loading.className = 'msg ai';
  loading.innerHTML = '<div class="bubble">思考中...</div>';
  chat.appendChild(loading);
  chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: msg})});
    const data = await r.json();
    loading.remove();
    if (data.error) addMsg('ai', '出错了：' + data.error);
    else addMsg('ai', data.answer, data.trace);
  } catch (err) {
    loading.remove();
    addMsg('ai', '网络错误：' + err.message);
  }
}
async function reset() {
  await fetch('/api/reset', {method:'POST'});
  chat.innerHTML = '';
}
</script>
</body>
</html>
